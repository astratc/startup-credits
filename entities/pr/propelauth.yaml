    offer_slug_aliases: []
    title: PropelAuth Growth plan free for 6 months
    summary: Startups that raised less than $5M, started in the last three years, have fewer than 25 people and never paid for PropelAuth get the $150/month Growth plan free for six months.
    description: The six-month option is worth $900 of Growth. Regular Growth pricing applies after the six months, and the company can drop to the Free plan whenever it wants.
